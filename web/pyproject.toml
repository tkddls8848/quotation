[project]
name = "quotation-web"
version = "0.1.0"
description = "eConfig XML을 견적서 xlsx로 바꾸는 Cloudflare Python Worker"
requires-python = ">=3.12"

# Worker 번들에 들어가는 런타임 의존성.
#
# 데스크톱(requirements.txt)은 PyPI 를 쓰지만 Worker 는 Pyodide 인덱스
# (index.pyodide.org)에서 emscripten-wasm32 wheel 을 받는다. 그쪽에 없는 판본은
# 쓸 수 없다. 실제로 lxml==6.1.1 은 wheel 이 없어 배포가 막혔다.
#
#   × Because lxml==6.1.1 has no usable wheels ... requirements are unsatisfiable
#
# 그래서 여기서는 판본을 못 박지 않고 인덱스가 주는 것을 받는다. CI 의 bundle
# 잡이 해석된 판본을 로그에 찍고 web/pylock.toml 로 고정한다. 데스크톱과 판본이
# 갈리면 tests/test_bytes_api.py 의 동등성 검증으로 차이를 잡는다.
dependencies = [
  "lxml",
  "openpyxl",
]

[tool.quotation]
# 공용 코어는 저장소 루트의 quotation/ 에 있다.
# scripts/sync_core.py 가 배포 직전에 src/quotation/ 으로 복사한다.
core_source = "../quotation"
core_target = "src/quotation"
