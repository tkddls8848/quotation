[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econfig-quick-config"
version = "0.2.0"
description = "High-level component choices to IBM eConfig CFR workflow"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["econfig"]
package-dir = {econfig = "."}

[tool.setuptools.package-data]
econfig = ["examples/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
