name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: 공용 코어 · 데스크톱 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt maturin
      - name: 변환 코어 확장 설치
        # 변환 규칙은 Rust 한 벌이다. 파이썬은 그것을 부른다 (계획 §4).
        run: |
          maturin build --release -m quotation/rust/python/Cargo.toml --out target/wheels
          python -m pip install target/wheels/*.whl
      - name: 테스트
        run: python -m pytest -q

  browser:
    name: 브라우저 변환 동일성 (무료 계정 운영 경로)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt maturin
      - name: 변환 코어 확장 설치
        # 브라우저 산출물을 데스크톱 경로와 대조하려면 확장이 있어야 한다.
        run: |
          maturin build --release -m quotation/rust/python/Cargo.toml --out target/wheels
          python -m pip install target/wheels/*.whl
      - name: 브라우저 변환 엔진 생성
        # Rust 코어를 wasm 으로 빌드해 정적 자산으로 내보낸다. 전송 크기가
        # 결정 0008 의 한도를 넘으면 여기서 멈춘다.
        run: |
          bash web/scripts/ensure_wasm_toolchain.sh
          python quotation/web/scripts/build_browser_engine.py
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web
      - name: 브라우저 구동 도구
        # 견적서 기능이 제 구동 도구를 갖는다. Node 는 스크립트가 놓인 자리에서
        # 패키지를 찾으므로 셸(web/)에 깔면 e2e 스크립트가 찾지 못한다.
        run: npm install && npx playwright install --with-deps chromium
        working-directory: quotation/web
      - name: 동일성 검증
        # 브라우저가 만든 견적서가 CPython 산출물과 같은지 셀 단위로 대조한다
        # (결정 0009). 실제 Chromium 으로 받은 파일도 같은 기준으로 본다.
        # 여기가 붉으면 무료 계정 운영 경로를 내보내면 안 된다.
        run: |
          # 파이프를 타므로 pipefail 이 없으면 pytest 실패가 tee 의 0 에 삼켜진다.
          set -o pipefail
          python -m pytest quotation/web/tests -q -rs | tee pytest-web.txt

      - name: 관문이 비어 있지 않은지
        # 잡이 녹색이어도 그 안에서 조용히 건너뛰었으면 아무것도 검증하지 않은
        # 것이다. 실제로 그런 일이 있었다 — 없는 패키지 이름을 부르던 탐침이
        # cargo 실패를 skip 으로 삼키고 내내 비어 있었다. CI 에는 건너뛸 이유가
        # 없다 (엔진·node·브라우저를 모두 앞 단계에서 갖춘다).
        run: |
          if grep -qE "[0-9]+ skipped" pytest-web.txt; then
            echo "CI 에서는 이 검증이 건너뛰어지면 안 됩니다:"
            grep "SKIPPED" pytest-web.txt || true
            exit 1
          fi
          echo "건너뛴 검증 없음"

      - name: 엔진 자산 크기
        if: always()
        run: du -sh web/public/engine && ls -la web/public/engine

  rust:
    name: Rust 코어 · 파이썬 대조 · WASM 크기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt maturin
      - name: 서식과 린트
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust 테스트
        run: cargo test --workspace
      - name: 확장 모듈 빌드와 설치
        # 관문 3 — 데스크톱과 CI 가 쓸 배포 형태가 리눅스에서도 서는지 본다.
        run: |
          maturin build --release -m quotation/rust/python/Cargo.toml --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl
      - name: WASM 전송 크기
        # 관문 2 — 전송 크기가 이 선을 넘으면 브라우저 자산 교체의 전제가
        # 무너진다. 선의 근거는 결정 0008 에 있다.
        run: |
          bash web/scripts/ensure_wasm_toolchain.sh
          wasm-pack build quotation/rust/wasm --release --target web --out-dir pkg
          python - <<'PY'
          import gzip, pathlib, sys
          pkg = pathlib.Path("quotation/rust/wasm/pkg")
          total = sum(len(gzip.compress(f.read_bytes(), 9))
                      for f in pkg.iterdir() if f.suffix in (".wasm", ".js"))
          limit = int(1.1 * 1024 * 1024)  # 결정 0008 의 1.1 MiB
          print(f"전송 자산 gzip {total:,} B = {total / 1048576:.3f} MiB (한도 {limit:,} B)")
          sys.exit(0 if total <= limit else 1)
          PY

  frontend:
    name: 웹 UI lint · 테스트 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  converters:
    name: 문서 변환기 — 실제 브라우저
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: 브라우저 갖추기
        # playwright 는 셸(web/)의 devDependency 다. 스크립트는 거기서 찾는다.
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: 화면과 산출물 검사
        # 실제 Chromium 으로 변환기 탭을 조작해 내려받은 HWPX 를 뜯어 본다.
        # HWP → PDF 는 830MB 짜리 변환 컨테이너가 있어야 해서 여기서 돌리지 않는다.
        # 그 경로는 converters/server/smoke.py 로 손으로 잰다 (결정 0016).
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 18574 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18574/ >/dev/null && break
            sleep 1
          done
          node converters/web/scripts/check-converters.mjs

  bundle:
    name: 배포 설정 검증 (정적 자산 — 무료 계정)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 설치 (web/package.json 에 고정된 판본)
        run: npm ci
        working-directory: web
      - name: 정적 자산 빌드
        run: npm run build
        working-directory: web
      - name: 배포 검사 (Worker 스크립트 없음)
        # 여기 Worker 스크립트가 잡히면 무료 계정 전제가 깨진 것이다.
        # 변환은 브라우저의 Rust→WASM 엔진이 한다 (결정 0002, 0010, 0014).
        # 문서 변환기의 HWP → PDF 서버는 Worker 가 아니라 따로 도는 컨테이너라
        # 이 배포에 들어오지 않는다 (결정 0016).
        #
        # 배포 자체는 여기서 하지 않는다. Cloudflare Workers Builds 가 저장소를
        # 보고 짓고 올린다 (결정 0017). 이 잡은 "올라갈 것이 정적 자산뿐인가"만 본다.
        run: npx wrangler deploy --dry-run --env="" --outdir .wrangler/dry-run
        working-directory: web
