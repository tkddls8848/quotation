name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Python Workers 배포에 필요한 최소 판본.
  # pywrangler 는 wrangler 4.42.1 이상을 요구하고, wrangler 3.x 는 wrangler.jsonc
  # 를 아예 읽지 못한다 (설정을 못 찾아 "Missing entry-point" 로 실패한다).
  MIN_UV_VERSION: "0.12.3"

jobs:
  core:
    name: 공용 코어 · 데스크톱 · Worker · eConfig 테스트 (lxml ${{ matrix.lxml }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 데스크톱(requirements.txt)과 Worker(web/pyproject.toml)의 lxml 판본이
        # 다르다. Pyodide 인덱스에 6.1.1 wheel 이 없어서다. 같은 코어가 두 판본
        # 모두에서 같게 동작하는지 확인한다.
        lxml: ["6.1.1", "6.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "lxml==${{ matrix.lxml }}"
      - name: 공용 코어와 템플릿 생성
        # 브라우저 엔진 포장 검사가 이 산출물을 본다.
        run: python web/scripts/sync_core.py
      - name: 테스트
        run: python -m pytest -q

  browser:
    name: 브라우저 변환 동일성 (무료 계정 운영 경로)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 공용 코어와 템플릿 생성
        run: python web/scripts/sync_core.py
      - name: 브라우저 변환 엔진 생성
        # Pyodide 런타임과 wheel 을 받아 온다. 받는 것마다 sha256 이 고정되어
        # 있어 인덱스가 흔들리면 여기서 멈춘다.
        run: python web/scripts/build_browser_engine.py
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web/frontend
      - name: 브라우저 구동 도구
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: web/frontend
      - name: 동일성 검증
        # 브라우저가 만든 견적서가 CPython 산출물과 같은지 셀 단위·바이트 단위로
        # 대조한다. 여기가 붉으면 무료 계정 운영 경로를 내보내면 안 된다.
        run: python -m pytest web/tests -q
      - name: 엔진 자산 크기
        if: always()
        run: du -sh web/frontend/public/py && ls -la web/frontend/public/py

  frontend:
    name: 웹 UI lint · 테스트 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bundle:
    name: 배포 설정 검증 (무료 기본 + Paid 서버 환경)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 배포 도구 설치
        run: |
          python -m pip install -r requirements.txt
          python -m pip install workers-py "uv>=${MIN_UV_VERSION}"
      - name: wrangler 설치 (web/package.json 에 고정된 판본)
        run: npm ci
        working-directory: web
      - name: 정적 자산 빌드
        run: npm ci && npm run build
        working-directory: web/frontend
      - name: 공용 코어를 Worker 번들로 복사
        run: python web/scripts/sync_core.py
      - name: 무료 계정 기본 배포 검사 (Worker 스크립트 없음)
        # 여기 Worker 스크립트가 잡히면 무료 계정 전제가 깨진 것이다.
        run: npx wrangler deploy --dry-run --env="" --outdir .wrangler/dry-run
        working-directory: web
      - name: Pyodide 의존성 해석 (Workers Paid 서버 환경용)
        # lxml·openpyxl 을 Pyodide 대상으로 받아 web/python_modules 에 넣는다.
        # 무료 계정 배포에는 쓰이지 않지만, `--env server` 로 올릴 길이 계속
        # 열려 있는지 여기서 확인한다.
        #
        # `pywrangler sync` 는 --env 를 모른다(사용 가능한 옵션이 아니다) — 이
        # 저장소의 최상위 wrangler.jsonc 는 무료 계정 전제로 Worker 스크립트가
        # 없어 `python_workers` 플래그도 없으므로, 최상위만 보는 이 명령은
        # `--env server` 설정과 무관하게 항상 실패한다(workers-py 1.16.6,
        # 2026-08-14 무렵부터). 아래 "Paid 서버 환경 검사" 가 `wrangler deploy
        # --dry-run --env server` 로 실제로 필요한 것(그 env 설정이 유효한지)을
        # 이미 검증하므로, 여기서는 실패해도 배포를 막지 않는다.
        continue-on-error: true
        run: python3 -m pywrangler sync
        working-directory: web
      - name: 해석된 판본과 번들 크기
        # 여기 찍히는 판본을 web/pylock.toml 로 고정한다. 배포 번들 한도
        # (Paid 10 MB)에 드는지도 여기서 본다.
        if: always()
        run: |
          echo "::group::pylock.toml"
          [ -f pylock.toml ] && grep -E '^name|^version|^\[\[packages' pylock.toml | paste - - - | head -40 || echo "(없음)"
          echo "::endgroup::"
          echo "::group::python_modules 크기"
          [ -d python_modules ] && du -sh python_modules && du -sh python_modules/* | sort -rh | head -15 || echo "(없음)"
          echo "::endgroup::"
        working-directory: web
      - name: Worker 가 부르는 이름이 실제 SDK 에 있는지
        # workers SDK 는 JS 객체를 파이썬 클래스로 감싸서 준다. JS 이름을 부르면
        # AttributeError 가 나는데 worker.py 가 그것을 사용자 문구 하나로 접어
        # 버려, 배포된 앱이 모든 변환을 거절하면서도 아무 단서를 남기지 않았다
        # (사고 기록 incidents/0001). sync 로 받은 실제 SDK 소스와 대조한다.
        run: python -m pytest web/tests/test_worker_runtime.py -q
        working-directory: ${{ github.workspace }}
      - name: Paid 서버 환경 검사 (자격 증명 없이)
        run: npx wrangler deploy --dry-run --env server --outdir .wrangler/dry-run-server
        working-directory: web

  deploy-staging:
    name: 스테이징 배포 (정적 자산 — 무료 계정)
    needs: [core, browser, frontend, bundle]
    # Cloudflare 계정 준비가 끝나면 저장소 변수 CLOUDFLARE_DEPLOY 를 true 로 두고
    # 비밀값 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 를 등록한다.
    # 그 전까지는 배포 단계를 건너뛰어 파이프라인을 붉게 만들지 않는다.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - name: 공용 코어와 템플릿 생성
        run: python web/scripts/sync_core.py
      - name: 브라우저 변환 엔진 생성
        run: python web/scripts/build_browser_engine.py
      - name: 정적 자산 빌드
        run: npm ci && npm run build
        working-directory: web/frontend
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
      - name: 인증 확인 (진단용)
        # 토큰이 잘못됐을 때 업로드까지 갔다가 code 10000 으로 죽는 대신
        # 여기서 무슨 권한을 갖고 있는지 먼저 보여 준다.
        # whoami 는 User Details 권한을 따로 요구하므로 실패해도 배포는 시도한다.
        # 판정은 다음 단계의 실제 배포가 한다.
        continue-on-error: true
        run: npx wrangler whoami
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포
        # 무료 계정 배포는 정적 자산뿐이라 pywrangler 가 필요 없다. Workers Paid
        # 에 서버 변환 API 까지 올릴 때만 `cf_deploy.sh deploy --env server` 를
        # 쓴다 (그쪽은 pywrangler 로 의존성을 vendoring 한다).
        run: bash scripts/cf_deploy.sh deploy --env staging
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 스모크 테스트
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "STAGING_BASE_URL 변수가 없어 스모크 테스트를 건너뜁니다." && exit 0
          fi
          # 변환 엔진이 실제로 배포됐는지 본다. 이것이 없으면 화면이 뜨더라도
          # 변환이 되지 않는다.
          curl -sSf "$BASE_URL/py/engine.json" | tee /dev/stderr | grep -q template_version
          curl -sSfI "$BASE_URL/py/pyodide.asm.wasm" | grep -qi "200"
