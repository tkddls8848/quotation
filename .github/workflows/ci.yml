name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: 공용 코어 · 데스크톱 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt maturin
      - name: 변환 코어 확장 설치
        # 변환 규칙은 Rust 한 벌이다. 파이썬은 그것을 부른다 (계획 §4).
        run: |
          maturin build --release -m quotation/rust/python/Cargo.toml --out target/wheels
          python -m pip install target/wheels/*.whl
      - name: 테스트
        run: python -m pytest -q

  browser:
    name: 브라우저 변환 동일성 (무료 계정 운영 경로)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt maturin
      - name: 변환 코어 확장 설치
        # 브라우저 산출물을 데스크톱 경로와 대조하려면 확장이 있어야 한다.
        run: |
          maturin build --release -m quotation/rust/python/Cargo.toml --out target/wheels
          python -m pip install target/wheels/*.whl
      - name: 브라우저 변환 엔진 생성
        # Rust 코어를 wasm 으로 빌드해 정적 자산으로 내보낸다. 전송 크기가
        # 결정 0008 의 한도를 넘으면 여기서 멈춘다.
        run: |
          bash web/scripts/ensure_wasm_toolchain.sh
          python quotation/web/scripts/build_browser_engine.py
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web
      - name: 브라우저 구동 도구
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: web
      - name: 동일성 검증
        # 브라우저가 만든 견적서가 CPython 산출물과 같은지 셀 단위로 대조한다
        # (결정 0009). 실제 Chromium 으로 받은 파일도 같은 기준으로 본다.
        # 여기가 붉으면 무료 계정 운영 경로를 내보내면 안 된다.
        run: python -m pytest quotation/web/tests -q
      - name: 엔진 자산 크기
        if: always()
        run: du -sh web/public/engine && ls -la web/public/engine

  rust:
    name: Rust 코어 · 파이썬 대조 · WASM 크기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt maturin
      - name: 서식과 린트
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust 테스트
        run: cargo test --workspace
      - name: 확장 모듈 빌드와 설치
        # 관문 3 — 데스크톱과 CI 가 쓸 배포 형태가 리눅스에서도 서는지 본다.
        run: |
          maturin build --release -m quotation/rust/python/Cargo.toml --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl
      - name: WASM 전송 크기
        # 관문 2 — 전송 크기가 이 선을 넘으면 브라우저 자산 교체의 전제가
        # 무너진다. 선의 근거는 결정 0008 에 있다.
        run: |
          bash web/scripts/ensure_wasm_toolchain.sh
          wasm-pack build quotation/rust/wasm --release --target web --out-dir pkg
          python - <<'PY'
          import gzip, pathlib, sys
          pkg = pathlib.Path("quotation/rust/wasm/pkg")
          total = sum(len(gzip.compress(f.read_bytes(), 9))
                      for f in pkg.iterdir() if f.suffix in (".wasm", ".js"))
          limit = int(1.1 * 1024 * 1024)  # 결정 0008 의 1.1 MiB
          print(f"전송 자산 gzip {total:,} B = {total / 1048576:.3f} MiB (한도 {limit:,} B)")
          sys.exit(0 if total <= limit else 1)
          PY

  frontend:
    name: 웹 UI lint · 테스트 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bundle:
    name: 배포 설정 검증 (정적 자산 — 무료 계정)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 설치 (web/package.json 에 고정된 판본)
        run: npm ci
        working-directory: web
      - name: 정적 자산 빌드
        run: npm run build
        working-directory: web
      - name: 배포 검사 (Worker 스크립트 없음)
        # 여기 Worker 스크립트가 잡히면 무료 계정 전제가 깨진 것이다.
        # 변환은 브라우저의 Rust→WASM 엔진이 한다 (결정 0002, 0010).
        run: npx wrangler deploy --dry-run --env="" --outdir .wrangler/dry-run
        working-directory: web

  deploy-staging:
    name: 스테이징 배포 (정적 자산 — 무료 계정)
    needs: [core, browser, frontend, bundle]
    # Cloudflare 계정 준비가 끝나면 저장소 변수 CLOUDFLARE_DEPLOY 를 true 로 두고
    # 비밀값 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 를 등록한다.
    # 그 전까지는 배포 단계를 건너뛰어 파이프라인을 붉게 만들지 않는다.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - name: 브라우저 변환 엔진 생성
        # 내보낼 자산을 여기서 짓는다. 변환 엔진은 Rust→WASM 이므로 wasm-pack 이
        # 있어야 한다 — ensure_wasm_toolchain.sh 가 없는 것만 채운다.
        run: |
          bash web/scripts/ensure_wasm_toolchain.sh
          python quotation/web/scripts/build_browser_engine.py
      - name: 정적 자산 빌드
        run: npm ci && npm run build
        working-directory: web
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
      - name: 인증 확인 (진단용)
        # 토큰이 잘못됐을 때 업로드까지 갔다가 code 10000 으로 죽는 대신
        # 여기서 무슨 권한을 갖고 있는지 먼저 보여 준다.
        # whoami 는 User Details 권한을 따로 요구하므로 실패해도 배포는 시도한다.
        # 판정은 다음 단계의 실제 배포가 한다.
        continue-on-error: true
        run: npx wrangler whoami
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포
        # 배포는 정적 자산뿐이다. 변환은 브라우저의 Rust→WASM 엔진이 하므로
        # Worker 스크립트도, pywrangler 도 필요 없다 (결정 0002, 0010).
        run: bash scripts/cf_deploy.sh deploy --env staging
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 스모크 테스트
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "STAGING_BASE_URL 변수가 없어 스모크 테스트를 건너뜁니다." && exit 0
          fi
          # 변환 엔진이 실제로 배포됐는지 본다. 이것이 없으면 화면이 뜨더라도
          # 변환이 되지 않는다.
          curl -sSf "$BASE_URL/engine/engine.json" | tee /dev/stderr | grep -q rust-wasm
          curl -sSfI "$BASE_URL/engine/quotation_wasm_bg.wasm" | grep -qi "200"
