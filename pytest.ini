[pytest]
# 네 갈래(공용 코어 · 웹 · 데스크톱 · eConfig)를 한 번에 돌린다.
# 임포트 경로는 저장소 루트 conftest.py 가 잡는다. 이 파일이 있어야 어느
# 폴더를 인수로 주든 rootdir 이 저장소 루트로 고정되어 그 conftest 가 실린다.
#
# econfig/ 는 딸린 의존성이 없어 requirements.txt 만으로 돈다. econfig/
# 안에서 따로 돌리고 싶으면 그쪽 pyproject.toml 의 testpaths 가 받는다.
testpaths = tests web/tests desktop/tests econfig/tests
